<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok Authorization Complete</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    max-width: 680px;
    margin: 3rem auto;
    padding: 0 1.5rem;
    line-height: 1.6;
    color: #1a1a1a;
  }
  h1 { font-size: 1.5rem; }
  .code-box {
    background: #f4f4f4;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 1rem;
    font-family: "SFMono-Regular", Consolas, monospace;
    word-break: break-all;
    margin: 1rem 0;
  }
  button {
    padding: 0.6rem 1.2rem;
    font-size: 1rem;
    border: none;
    border-radius: 6px;
    background: #0b5fff;
    color: white;
    cursor: pointer;
  }
  button:hover { background: #0a4fd6; }
  .error { color: #b00020; }
  #status { margin-top: 0.75rem; color: #555; }
</style>
</head>
<body>
  <h1>TikTok Authorization Complete</h1>
  <p>Copy the authorization code below and paste it back into the terminal to finish connecting this account.</p>
  <div class="code-box" id="codeBox">Reading code from URL&hellip;</div>
  <button id="copyBtn" style="display:none;">Copy code</button>
  <div id="status"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    const error = params.get('error');
    const errorDescription = params.get('error_description');
    const box = document.getElementById('codeBox');
    const btn = document.getElementById('copyBtn');
    const status = document.getElementById('status');

    if (code) {
      box.textContent = code;
      btn.style.display = 'inline-block';
      btn.addEventListener('click', () => {
        navigator.clipboard.writeText(code).then(() => {
          status.textContent = 'Copied to clipboard.';
        });
      });
    } else if (error) {
      box.textContent = error + (errorDescription ? ': ' + errorDescription : '');
      box.classList.add('error');
    } else {
      box.textContent = 'No authorization code found in the URL.';
      box.classList.add('error');
    }
  </script>
</body>
</html>
